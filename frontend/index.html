<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Clipper - 智能视频切片</title>
    <!-- v2.2.1: 提前设 data-theme 避免 dark flash (跟 ThemeToggle.jsx DEFAULT_THEME 同步) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('video-clipper-theme');
          document.documentElement.dataset.theme = saved || 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
