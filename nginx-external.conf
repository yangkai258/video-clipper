events {
    worker_connections 1024;
}

http {
    # 上传视频有时很大，调大
    client_max_body_size 5G;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 8080;
        server_name _;

        # Basic Auth（团队共享账号）
        auth_basic "Video Clipper";
        auth_basic_user_file /Users/zhuobao/.openclaw-rescue4/workspace/video-clipper/.htpasswd;

        # /api 直接转 uvicorn（绕开 vite proxy，大 body 才不超时）
        # cloudflared 默认 100s timeout，50MB body 走 vite 会卡
        location /api/ {
            proxy_pass http://127.0.0.1:8030/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;  # 大文件不缓冲，直接转发流
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 5G;
        }

        # 其它（前端）转 vite
        location / {
            proxy_pass http://127.0.0.1:3030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
