[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --tb=short --color=yes
markers =
    e2e: end-to-end tests (跑 worker pipeline, 默认 skip, 主动 -m e2e 跑)